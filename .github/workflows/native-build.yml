name: Native Android and iPhone builds
on:
  push:
    paths: ['mobile/**', 'native-bridge.js', '.github/workflows/native-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Android debug APK
        working-directory: mobile/android
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: szovetseg-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: mobile/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iPhone simulator app
        run: xcodebuild -project mobile/ios/Szovetseg.xcodeproj -scheme Szovetseg -configuration Debug -sdk iphonesimulator -derivedDataPath /tmp/szovetseg-build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: szovetseg-ios-simulator-unsigned
          path: /tmp/szovetseg-build/Build/Products/Debug-iphonesimulator/Szovetseg.app
